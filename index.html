<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBF6EF">
<title>Diagnostic de peau · Pulpe de Vie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EF; --panel:#EFE3D3; --wood:#C9A27A; --wood-d:#9C7349; --arch:#FFD0D2;
    --ink:#3A2A22; --muted:#7D675B; --rust:#2BB38A; --red:#C8404E; --line:#E6D8C6; --white:#FFFDF9;
    --concombre:#5B7B3A; --pamplemousse:#C87240; --peche:#D9535F; --figue:#9C4766;
    --serif:"Fraunces",Georgia,serif; --sans:"DM Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  button{font-family:var(--sans)}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 36px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
  .kicker{font-size:12px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--rust)}
  .brand{font-family:var(--serif);font-weight:800;font-size:22px;line-height:1;margin-top:6px}
  .brand em{font-style:italic;font-weight:500;color:var(--red)}
  .hstep{font-size:13px;color:var(--muted);text-align:right}
  h1,h2,h3{font-family:var(--serif);margin:0;color:var(--ink);font-weight:800;letter-spacing:-.5px}
  h1 em,h2 em{font-style:italic;font-weight:500;color:var(--red)}
  .label{font-size:12px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--ink)}
  .muted{color:var(--muted)}

  /* Arche & disques fruits */
  .arch{background:var(--arch);border-radius:999px 999px 0 0;position:relative}
  .disc{border-radius:50%;display:inline-block;flex:none}
  .discs{display:grid;grid-template-columns:repeat(2,auto);gap:12px;justify-content:center}

  /* Panneau principal */
  .stage{background:var(--panel);border-radius:22px;overflow:hidden;position:relative}
  .split{display:grid;grid-template-columns:1fr;min-height:520px}
  .side{padding:28px 24px 8px}
  .main{padding:8px 24px 28px}
  @media (min-width:900px){
    .split{grid-template-columns:5fr 7fr;min-height:620px}
    .side{padding:48px 40px;border-right:1.5px solid var(--line);display:flex;flex-direction:column}
    .main{padding:48px 40px;display:flex;flex-direction:column;justify-content:center}
  }
  .side h2{font-size:clamp(28px,3.4vw,44px);line-height:1.05}
  .side p{font-size:16px;line-height:1.55;color:var(--muted);margin:14px 0 0}
  .progress{display:flex;gap:6px;margin-top:auto;padding-top:24px}
  .progress i{flex:1;height:6px;border-radius:6px;background:#E2D2BE}
  .progress i.on{background:var(--rust)}

  /* Options */
  .opts{display:grid;gap:12px;grid-template-columns:1fr}
  @media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
  .opt{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);background:var(--white);border-radius:16px;padding:18px;min-height:84px;cursor:pointer;color:var(--ink);font-size:16px;font-weight:700;transition:border-color .15s, transform .1s, background .15s}
  .opt:hover{border-color:var(--wood)}
  .opt:active{transform:scale(.985)}
  .opt small{display:block;color:var(--muted);font-weight:400;font-size:14px;margin-top:3px;line-height:1.35}
  .opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--wood);flex:none;position:relative;background:#fff}
  .opt.sel{border-color:var(--ink);background:#FFF7F0}
  .opt.sel .dot{background:var(--ink);border-color:var(--ink)}
  .opt.sel .dot::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--white)}
  .opt .sw{width:34px;height:34px;border-radius:50%;flex:none}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
  .btn{appearance:none;border:0;background:var(--ink);color:var(--white);font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;padding:18px 28px;border-radius:999px;cursor:pointer;min-height:56px;transition:background .15s, transform .1s}
  .btn:hover{background:#2A1D17}
  .btn:active{transform:scale(.98)}
  .btn:disabled{background:#D9C8B4;color:#9C8676;cursor:not-allowed}
  .btn.red{background:var(--red)}
  .btn.ghost{background:transparent;color:var(--muted);letter-spacing:0;text-transform:none;font-size:15px;padding:12px 4px}
  .btn.full{width:100%}

  /* Accueil */
  .welcome .side{justify-content:center}
  .welcome .main{align-items:center}
  .hero-arch{width:min(320px,80%);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;margin:0 auto;padding-top:30px}
  .hero-arch .screen{width:66%;background:var(--white);border:7px solid var(--ink);border-radius:18px;padding:22px 12px;text-align:center}
  .hero-arch .screen .kicker{font-size:10px}
  .hero-arch .screen h3{font-size:22px;line-height:1.1;margin:8px 0 14px}
  .hero-arch .disc{width:42px;height:42px}
  .facts{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap}
  .facts div{font-size:13px;color:var(--muted)}
  .facts b{display:block;font-family:var(--serif);font-size:24px;color:var(--ink)}

  /* Formulaire */
  label.f{display:block;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:16px 0 8px}
  input[type=text],input[type=email]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:16px;font:500 18px var(--sans);color:var(--ink);background:var(--white);outline:none}
  input:focus{border-color:var(--ink)}
  input.err{border-color:var(--red)}
  .domains{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .domains button{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:9px 13px;font-size:14px;color:var(--ink);cursor:pointer}
  .errmsg{color:var(--red);font-size:13px;font-weight:700;margin-top:6px}
  .check{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:15px;line-height:1.4;cursor:pointer}
  .check input{width:24px;height:24px;accent-color:var(--ink);flex:none;margin:0}
  .legal{font-size:12px;color:var(--muted);line-height:1.5;margin-top:16px}

  /* Résultat */
  .res-arch{width:min(280px,80%);aspect-ratio:4/5;margin:6px auto 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:999px 999px 0 0;padding:44px 20px 20px}
  .res-arch .disc{width:96px;height:96px;margin-bottom:14px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.08)}
  .res-arch .kicker{color:var(--ink);opacity:.75}
  .res-arch h2{font-size:clamp(30px,3.6vw,42px);margin-top:6px}
  .go{margin-top:18px;background:var(--white);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.4;display:flex;gap:12px;align-items:center}
  .go b{display:block}
  .arrow{width:38px;height:38px;border-radius:50%;background:var(--rust);color:#fff;display:grid;place-items:center;flex:none;font-weight:700}
  .prod{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1.5px dashed var(--line)}
  .prod:last-child{border-bottom:0}
  .num{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--white);display:grid;place-items:center;font:700 14px var(--sans);flex:none}
  .prod .k{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--rust)}
  .prod h3{font-size:18px;margin:2px 0 4px;letter-spacing:-.2px}
  .prod p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .price{font-weight:700;font-size:14px;margin-top:4px;display:inline-block}
  .gift{margin-top:18px;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--white);border:1.5px dashed var(--wood)}
  .gift .code{font:800 24px var(--serif);letter-spacing:1px}
  .gift small{display:block;font-size:12px;color:var(--muted)}
  .omni{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .omni div{background:var(--white);border-radius:14px;padding:12px;font-size:13px;line-height:1.4;color:var(--muted)}
  .omni b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
  .tip{margin-top:14px;font-size:14px;line-height:1.5;color:var(--ink);border-left:3px solid var(--rust);padding-left:12px}

  /* Inactivité borne */
  .idle{position:fixed;inset:0;background:rgba(58,42,34,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
  .idle.on{display:flex}
  .idle div{background:var(--bg);border-radius:22px;padding:30px;max-width:420px;text-align:center}
  .idle h3{font-size:28px;margin-bottom:8px}
  .idle p{color:var(--muted);margin:0 0 20px}

  /* Écran 43" */
  .screen43{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vh 6vw;background:#fff}
  .screen43 .kicker{font-size:clamp(12px,1.6vh,22px)}
  .screen43 .tag{font-family:var(--serif);font-style:italic;color:#E8606B;font-size:clamp(22px,3.6vh,48px);margin-bottom:3vh}
  .screen43 .frame{background:var(--white);border:clamp(8px,1.2vh,16px) solid var(--ink);border-radius:clamp(18px,3vh,36px);padding:6vh 5vw;width:min(92vw,62vh)}
  .screen43 h1{font-size:clamp(40px,7vh,96px);line-height:1}
  .screen43 .discs{gap:2.4vh;margin:5vh 0}
  .screen43 .disc{width:clamp(70px,11vh,150px);height:clamp(70px,11vh,150px);transition:transform .5s, opacity .5s;opacity:.35}
  .screen43 .disc.on{transform:scale(1.12);opacity:1}
  .screen43 .fname{font-family:var(--serif);font-size:clamp(26px,4.2vh,56px);font-weight:800}
  .screen43 .fdesc{color:var(--muted);font-size:clamp(16px,2.2vh,28px);margin-top:1vh;min-height:3em}
  .screen43 .cta{margin-top:4vh;font-size:clamp(16px,2.2vh,28px);color:var(--ink)}
  .screen43.reveal .frame{border-color:var(--rust)}

  /* Admin */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
  .stat{background:var(--white);border-radius:14px;padding:14px;text-align:center}
  .stat b{display:block;font:800 26px var(--serif)}
  .stat span{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--white);border-radius:14px;overflow:hidden}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
  .tablewrap{overflow-x:auto;max-height:440px;border-radius:14px}
  .note-box{font-size:12px;background:#FBE6E6;color:#8E2433;border-radius:10px;padding:8px 10px;margin-bottom:12px}

  footer{text-align:center;font-size:12px;color:var(--muted);margin-top:20px;line-height:1.6}
  footer a{color:var(--muted)}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  body.kiosk footer{display:none}
  body.kiosk .wrap{max-width:none;min-height:100vh;display:flex;flex-direction:column}
  body.kiosk main{flex:1;display:flex;flex-direction:column}
  body.kiosk .stage{flex:1}
  /* ===== Version web : page produit à étapes (style pulpedevie.com) ===== */
  body.webmode{background:#fff}
  .w{max-width:760px;margin:0 auto;padding:0 20px}
  .wtop{background:#FF8189;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:9px 12px;letter-spacing:.3px}
  .whead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #F3E6E2;max-width:1100px;margin:0 auto}
  .whead .brand{margin:0}
  .whead nav{display:flex;gap:18px;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .whead nav a{color:var(--ink);text-decoration:none}
  .whead nav a.on{color:#E8606B}
  @media (max-width:640px){.whead nav{display:none}}
  .whero{text-align:center;padding:44px 0 28px}
  .pill{display:inline-block;background:#DFF4EC;color:#1E9468;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:7px 14px;border-radius:999px}
  .whero h1{font-size:clamp(36px,6vw,54px);margin:16px 0 10px;line-height:1.05}
  .whero .sub{font-size:16px;color:var(--muted)}
  .hlt{color:#2BB38A;padding:0 2px}
  .wintro{background:#FFF5F4;border-radius:22px;padding:24px;text-align:center;margin-bottom:30px}
  .wintro p{margin:0 0 14px;font-size:16px;line-height:1.55}
  .wintro ul{list-style:none;padding:0;margin:0;display:flex;justify-content:center;gap:10px 22px;flex-wrap:wrap;font-weight:700;font-size:14px}
  .wintro li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF8189;margin-right:8px;vertical-align:1px}
  .wstep{border:1.5px solid #F3E6E2;border-radius:22px;padding:22px;margin-bottom:14px;transition:border-color .2s, opacity .2s}
  .wstep.done{border-color:#FFC2C5}
  .wstep.locked{opacity:.45;pointer-events:none}
  .wstep-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .wnum{width:34px;height:34px;border-radius:50%;background:#FF8189;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
  .wstep.done .wnum{background:var(--ink)}
  .wstep-h h2{font-size:21px;letter-spacing:-.3px}
  .wstep-h small{display:block;font-family:var(--sans);font-weight:400;font-size:14px;color:var(--muted);letter-spacing:0;margin-top:2px}
  .wopts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (min-width:640px){.wopts.four{grid-template-columns:repeat(4,1fr)}}
  .wopt{border:1.5px solid #EEDFDA;background:#fff;border-radius:16px;padding:14px;text-align:left;cursor:pointer;font-weight:700;font-size:15px;color:var(--ink);transition:all .15s;display:flex;flex-direction:column;gap:6px}
  .wopt small{font-weight:400;color:var(--muted);font-size:13px;line-height:1.35}
  .wopt:hover{border-color:#FF8189}
  .wopt.sel{border-color:#FF8189;background:#FFF2F2;box-shadow:inset 0 0 0 1px #FF8189}
  .wopt .sw{width:30px;height:30px;border-radius:50%}
  .wbtn{appearance:none;border:0;background:#FF8189;color:#fff;font-weight:700;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;padding:18px 26px;border-radius:999px;cursor:pointer;width:100%;transition:background .15s}
  .wbtn:hover{background:#F26B76}
  .wbtn:disabled{background:#F4D9D6;color:#B69C96;cursor:not-allowed}
  .wform input[type=text],.wform input[type=email]{background:#fff}
  .wbadges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:34px 0;text-align:center}
  .wbadges div{font-size:13px;font-weight:700;line-height:1.3}
  .wbadges i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 8px;border-radius:50%;background:#FFE6E7;color:#D9485A}
  .wbadges svg{width:24px;height:24px}
  .wsec{padding:34px 0;border-top:1px solid #F3E6E2}
  .wsec h2{font-size:clamp(26px,4vw,34px);text-align:center;margin-bottom:22px;line-height:1.15}
  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media (max-width:600px){.how{grid-template-columns:1fr}}
  .how div{background:#FFF8F1;border-radius:18px;padding:18px;font-size:14px;line-height:1.5;color:var(--muted)}
  .how b{display:block;font-family:var(--serif);font-size:19px;color:var(--ink);margin:6px 0 4px}
  .how .wnum{width:30px;height:30px;font-size:14px}
  .fruits4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (min-width:640px){.fruits4{grid-template-columns:repeat(4,1fr)}}
  .fruits4 div{border-radius:999px 999px 18px 18px;padding:26px 12px 18px;text-align:center}
  .fruits4 .disc{width:54px;height:54px;margin-bottom:10px}
  .fruits4 b{display:block;font-family:var(--serif);font-size:18px}
  .fruits4 span.t{font-size:13px;color:var(--ink);opacity:.8}
  details{border-bottom:1px solid #F3E6E2;padding:16px 0}
  summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";font-size:22px;color:#E8606B;font-weight:400}
  details[open] summary::after{content:"–"}
  details p{color:var(--muted);line-height:1.6;font-size:15px;margin:10px 0 0}
  .wreass{background:#FFF5F4;margin-top:20px}
  .wreass .w{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:22px 20px;text-align:center;font-size:13px;font-weight:700}
  .wreass span{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
  @media (max-width:600px){.wreass .w{grid-template-columns:1fr 1fr}}
  .wfoot{text-align:center;font-size:12px;color:var(--muted);padding:20px;line-height:1.6}
  .wfoot a{color:var(--muted)}
  .wres{border:1.5px solid #FFC2C5;border-radius:22px;padding:24px;margin-bottom:14px;background:#fff}
  .wres-top{display:flex;gap:18px;align-items:center;border-radius:18px;padding:18px}
  .wres-top .disc{width:70px;height:70px}
  .wres-top h2{font-size:30px}
  @media (max-width:520px){.wres-top{flex-direction:column;text-align:center}}
  /* ===== Borne pop-up : style du site, une question par écran ===== */
  body.kiosk{background:#fff}
  .kwrap{min-height:100vh;display:flex;flex-direction:column}
  .ktop{background:#FF8189;color:#fff;text-align:center;font-size:14px;font-weight:700;padding:10px;letter-spacing:.3px}
  .khead{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid #F3E6E2}
  .khead .brand{margin:0;font-size:24px}
  .track{display:flex;gap:6px;justify-content:center;padding:18px 24px 0;flex-wrap:wrap}
  .track div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#B69C96;padding:6px 10px}
  .track span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#F6E9E6;color:#B69C96;font-size:13px}
  .track .on{color:var(--ink)} .track .on span{background:#FF8189;color:#fff}
  .track .ok{color:var(--ink)} .track .ok span{background:var(--ink);color:#fff}
  .kbody{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1180px;width:100%;margin:0 auto;padding:22px 32px 30px}
  .kq{text-align:center;margin-bottom:28px}
  .kq h1{font-size:clamp(34px,4.4vw,54px);line-height:1.05}
  .kq p{font-size:18px;color:var(--muted);margin:10px 0 0}
  .kopts{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
  @media (min-width:900px){.kopts.four{grid-template-columns:repeat(4,1fr)}.kopts.three{grid-template-columns:repeat(3,1fr)}}
  .kopt{border:2px solid #EEDFDA;background:#fff;border-radius:22px;padding:22px 20px;min-height:150px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;font-size:20px;font-weight:700;color:var(--ink);transition:all .15s;font-family:var(--sans)}
  .kopt small{font-size:15px;font-weight:400;color:var(--muted);line-height:1.35}
  .kopt:active{transform:scale(.98)}
  .kopt.sel{border-color:#FF8189;background:#FFF2F2;box-shadow:inset 0 0 0 1.5px #FF8189}
  .kopt .sw{width:46px;height:46px;border-radius:50%;margin-bottom:auto}
  .kfoot{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:14px}
  .kbtn{appearance:none;border:0;background:#FF8189;color:#fff;font:700 17px var(--sans);letter-spacing:1.5px;text-transform:uppercase;padding:22px 40px;border-radius:999px;cursor:pointer;min-height:66px}
  .kbtn:active{transform:scale(.98)}
  .kbtn:disabled{background:#F4D9D6;color:#B69C96}
  .kbtn.dark{background:var(--ink)}
  .kback{background:none;border:0;font:700 17px var(--sans);color:var(--muted);padding:16px 8px;cursor:pointer}
  .kwel{text-align:center}
  .kwel h1{font-size:clamp(44px,6vw,76px);line-height:1;margin:18px 0 12px}
  .kwel .sub{font-size:20px;color:var(--muted)}
  .karches{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:34px auto 30px;max-width:900px}
  .karches div{border-radius:999px 999px 20px 20px;padding:34px 10px 20px;text-align:center}
  .karches .disc{width:64px;height:64px;margin-bottom:12px}
  .karches b{display:block;font-family:var(--serif);font-size:20px}
  .karches span.t{font-size:14px;opacity:.8}
  @media (max-width:640px){.karches{grid-template-columns:repeat(2,1fr)}}
  .kperks{display:flex;justify-content:center;gap:28px;margin-top:22px;font-size:15px;font-weight:700;flex-wrap:wrap}
  .kperks span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#FF8189;margin-right:8px;vertical-align:1px}
  .kform{display:grid;grid-template-columns:1fr;gap:6px 34px;max-width:960px;margin:0 auto;width:100%}
  @media (min-width:900px){.kform{grid-template-columns:1fr 1fr}}
  .kform input[type=text],.kform input[type=email]{font-size:20px;padding:18px;background:#fff}
  .kform .domains button{font-size:16px;padding:12px 16px}
  .kform .check{font-size:16px}
  .kres{display:grid;grid-template-columns:1fr;gap:26px}
  @media (min-width:900px){.kres{grid-template-columns:5fr 7fr;align-items:start}}
  .kfruit{border-radius:999px 999px 26px 26px;padding:46px 26px 26px;text-align:center}
  .kfruit .disc{width:100px;height:100px;margin-bottom:14px}
  .kfruit h1{font-size:clamp(38px,4.4vw,54px);margin:6px 0}
  .kgo{margin-top:18px;background:#fff;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;font-size:16px;line-height:1.4}
  .kgo .arrow{width:46px;height:46px;font-size:20px}
  .kres .prod h3{font-size:20px}
  .kres .prod p{font-size:15px}
  .kcount{font-size:14px;color:var(--muted)}

  /* ===== Apparition progressive ===== */
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .appear{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
  .appear .wopt,.kopts .kopt{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 90ms + 250ms)}
  .kq h1{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .kq p{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:.12s}
  .kfoot{animation:rise .4s ease both;animation-delay:.7s}
  .wtyping{display:flex;gap:6px;justify-content:center;padding:18px 0}
  .wtyping i{width:9px;height:9px;border-radius:50%;background:#FF8189;animation:blink 1s infinite ease-in-out}
  .wtyping i:nth-child(2){animation-delay:.15s}.wtyping i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.appear,.appear .wopt,.kopts .kopt,.kq h1,.kq p,.kfoot{animation:none}}

  /* Cartes produits */
  .pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
  @media (min-width:640px){.wres .pgrid{grid-template-columns:repeat(4,1fr)}}
  .pcard{background:#fff;border:1.5px solid #F3E6E2;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 110ms + 200ms)}
  .pimg{aspect-ratio:1/1;display:grid;place-items:center;padding:0}
  .pimg img{display:block;max-width:100%;max-height:100%;width:100%;height:auto;object-fit:contain}
  .kres .pimg img{width:auto;height:124px;max-width:none}
  .kres .pimg{aspect-ratio:auto;height:124px;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pbody{padding:10px 12px 14px}
  .prole{display:inline-block;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:999px}
  .prange{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:8px}
  .pcard h3{font-size:15.5px;line-height:1.2;margin-top:3px;letter-spacing:-.2px}
  .pprice{font-weight:700;font-size:14px;margin-top:6px}
  .pnote{font-size:11.5px;color:var(--muted);margin-top:8px}
  .pwhy{font-size:12px;line-height:1.35;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed #F0E2DC}
  @media (prefers-reduced-motion:reduce){.pcard{animation:none}}

  .logo{height:46px;width:auto;display:block}
  .khead .logo{height:52px}
  .logo.big{height:clamp(70px,9vh,130px);margin-bottom:3vh}
  .kph,.wph{position:relative;display:block;width:100%;border-radius:14px;overflow:hidden;background:#FAF4E8}
  .kph{height:150px;margin-bottom:auto}
  .wph{height:110px}
  .kph img,.wph img{width:100%;height:100%;object-fit:contain;display:block}
  .kph.trio,.wph.trio{display:flex}
  .kph.face,.wph.face{background:#fff}
  .kph img.tex,.wph img.tex{object-fit:contain;background:#EFE9EC}
  .kph img.tex.fill,.wph img.tex.fill{object-fit:cover}
  .kph.face{height:190px}
  .wph.face{height:130px}
  @media (min-width:900px){.kopts.five{grid-template-columns:repeat(5,1fr)}}
  @media (min-width:640px){.wopts.five{grid-template-columns:repeat(3,1fr)}}
  .kopts.five .kopt,.kopts.two .kopt{min-height:110px;justify-content:center;text-align:center}
  .kopts.two{max-width:640px;margin:0 auto;width:100%}
  .trio img{flex:1;min-width:0}
  .kopt{min-height:150px}

  /* Photos de fruits */
  .disc.ph{box-shadow:0 0 0 4px #fff, 0 8px 18px -10px rgba(0,0,0,.35)}
  .wfruits{display:flex;justify-content:center;gap:14px;margin-top:22px}
  .wfruits figure{margin:0;text-align:center}
  .wfruits .disc{width:64px;height:64px;display:block;margin:0 auto 6px}
  .wfruits figcaption{font-size:11.5px;font-weight:700;color:var(--ink)}
  .karches .disc.ph{width:96px;height:96px}
  .wres-top .disc.ph{width:84px;height:84px}
  .screen43 .disc.ph{opacity:.45}
  .screen43 .disc.ph.on{opacity:1}
  /* Panier */
  .shipbar{background:#F3FBF7;border-radius:14px;padding:12px 14px;margin-top:16px}
  .shiptxt{font-size:14px;color:var(--ink)}
  .shiptxt b{color:#1E9468}
  .shiptrack{height:8px;background:#DCEFE6;border-radius:8px;margin-top:8px;overflow:hidden}
  .shiptrack i{display:block;height:100%;background:#2BB38A;border-radius:8px;transition:width .35s}
  .padd{margin-top:10px;width:100%;border:1.5px solid #FF8189;background:#fff;color:#E8606B;font:700 12.5px var(--sans);letter-spacing:.5px;padding:10px 8px;border-radius:999px;cursor:pointer}
  .padd.on{background:#2BB38A;border-color:#2BB38A;color:#fff}
  #cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid #F3E6E2;box-shadow:0 -10px 30px -18px rgba(0,0,0,.35);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;justify-content:space-between}
  #cartbar.on{display:flex}
  #cartbar small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  #cartbar .wbtn{width:auto;padding:14px 18px;font-size:13px}
  body.webmode{padding-bottom:84px}
  #cartdrawer{position:fixed;inset:0;z-index:30;background:rgba(58,42,34,.45);display:none;align-items:flex-end;justify-content:center}
  #cartdrawer.on{display:flex}
  .cpanel{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:rise .3s ease both}
  .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .chead h2{font-size:26px}
  .cx{border:0;background:#F6EEEA;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer;color:var(--ink)}
  .citem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F3E6E2}
  .citem img{width:58px;height:58px;object-fit:cover;border-radius:12px;background:#FAF4E8}
  .cinfo{flex:1;font-size:14px;line-height:1.3}
  .cinfo span{display:block;color:var(--muted);margin-top:2px}
  .cqty{display:flex;align-items:center;gap:8px}
  .cqty button{width:32px;height:32px;border-radius:50%;border:1.5px solid #EEDFDA;background:#fff;font-size:18px;cursor:pointer;color:var(--ink)}
  .crow{display:flex;justify-content:space-between;font-size:15px;padding:8px 0}
  .crow.total{font-weight:700;font-size:17px;border-top:1px solid #F3E6E2;margin:4px 0 14px;padding-top:12px}
  .kph img.tex:not(.fill),.wph img.tex:not(.fill){background:#E1CAB3}
</style>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mode = () => ({"#borne":"borne","#ecran":"ecran","#admin":"admin"})[location.hash] || "web";
const blank = () => ({ step:-1, answers:{}, contact:{prenom:"",email:"",consent:false,news:false}, result:null });
let state = blank();

function render(){
  const m = mode();
  document.body.classList.toggle("kiosk", m === "ecran");
  stopScreenLoop();
  if (m !== "web") document.body.classList.remove("webmode");
  if (m === "ecran") return renderScreen();
  if (m === "admin") return renderAdmin();
  if (m === "web" || m === "borne") { renderWeb(); armIdle(); return; }   // même interface sur téléphone et tablette
  document.body.classList.remove("webmode");
  shell();
  if (state.step === -1) renderWelcome();
  else if (state.step < Q.length) renderQuestion(Q[state.step]);
  else if (state.step === Q.length) renderEmail();
  else renderResult();
  armIdle();
}

/* ---------- Diagnostic ---------- */
function diagnose(a){
  const score = {concombre:0,pamplemousse:0,peche:0,figue:0};
  score[a.prio] += 2;
  score[{grasse:"concombre",mixte:"concombre",normale:"pamplemousse",seche:"figue"}[a.type]] += 1;
  const cf = {assoiffee:"peche",terne:"pamplemousse",mature:"figue",imperfections:"concombre"}[a.concern];
  if (cf) score[cf] += 1;
  const fruit = ORDER.reduce((best,k) => score[k] > score[best] || (score[k]===score[best] && k===a.prio) ? k : best, a.prio);
  const sens = a.concern === "sensible";
  const stress = a.stress === "oui";
  const lab = (qid, k) => (Q.find(q => q.id===qid).opts.find(o => o[0]===k) || [,""])[1];

  // 1 · Nettoyer : selon le type de peau (ou la sensibilité)
  const clean = sens ? "eauMicellaire" : {grasse:"mousseImp", mixte:"mousseImp", normale:"peauNeuve", seche:"geleeDouceur"}[a.type];
  const whyClean = sens ? "Votre peau est sensible" : `Adapté à votre ${lab("type",a.type).toLowerCase()}`;
  // 2 · Traiter : selon la priorité (= le fruit)
  let treat = {concombre:"noFilter",pamplemousse:"serumEclat",peche:"hydraCreme",figue:"ohMyGold"}[fruit];
  if (a.texture === "huile" && treat === "ohMyGold") treat = "theSerum";   // l'huile passe en soin hydratant
  const whyTreat = `Votre priorité : ${lab("prio",a.prio).toLowerCase()}`;
  // 3 · Hydrater : selon la texture préférée
  let tex = a.texture;
  if (tex === "egal") tex = {concombre:"gel",pamplemousse:"gel",peche:"creme",figue:"creme"}[fruit];
  let hydrate = tex === "gel" ? (fruit==="concombre" ? "perfectSelfie" : "gelCremeEclat")
              : tex === "huile" ? "ohMyGold"
              : (fruit==="pamplemousse" ? "bonneMine" : "hydraCreme");
  if (hydrate === treat) hydrate = fruit === "peche" ? "bonneMine" : "hydraCreme";
  const whyHydrate = a.texture === "egal" ? "Choisi pour votre fruit" : `Votre texture : ${lab("texture",a.texture).toLowerCase()}`;

  const used = new Set([clean, treat, hydrate]);
  const pick = list => list.find(k => !used.has(k));
  const extras = [];
  // En plus : selon l'autre préoccupation
  const forConcern = pick({assoiffee:["hydraCreme","geleeDouceur","eauMicellaire"], sensible:["rituelDemaq","eauMicellaire","hydraCreme"],
                           terne:["margarEclat","serumEclat","bonneMine"], mature:["theSerum","regard","ohMyGold"],
                           imperfections:["lotionPur","afterDate","noFilter"]}[a.concern] || []);
  if (forConcern){ used.add(forConcern); extras.push({k:forConcern, why:`Votre préoccupation : ${lab("concern",a.concern).toLowerCase()}`}); }
  // En plus : stress oxydatif → vitamine C antioxydante
  if (stress){ const k = pick(["serumEclat","margarEclat","gelCremeEclat"]); if (k){ used.add(k); extras.push({k, why:"Stress oxydatif : un soin éclat au pamplemousse"}); } }

  const tip = sens ? "Peau sensible : testez chaque nouveau soin dans le cou avant de l'appliquer sur le visage."
    : {concombre:"Ne décapez pas votre peau : un nettoyant trop fort la fait briller davantage.",
       pamplemousse:"La vitamine C s'applique le matin, avant votre crème, pour un teint lumineux toute la journée.",
       peche:"Appliquez votre soin sur peau encore légèrement humide pour mieux retenir l'eau.",
       figue:"Le soir, quelques gouttes d'huile sèche après votre crème, c'est le geste confort."}[fruit];
  const tip2 = stress ? tip + " Exposée au stress oxydatif : misez sur la vitamine C antioxydante le matin." : tip;
  return { fruit, steps:[clean, treat, hydrate], why:[whyClean, whyTreat, whyHydrate], extras,
           extra: extras[0] ? extras[0].k : null, tip: tip2, sensitive:sens, stress };
}


/* Carte produit : visuel (ou flacon dessiné en attendant), gamme, nom, geste */
function bottle(col){
  return `<svg viewBox="0 0 80 110" width="100%" height="100%" aria-hidden="true"><rect x="30" y="6" width="20" height="16" rx="4" fill="${col}" opacity=".85"/><rect x="18" y="22" width="44" height="80" rx="12" fill="#fff" stroke="${col}" stroke-width="3"/><rect x="24" y="52" width="32" height="28" rx="5" fill="${col}" opacity=".18"/><circle cx="40" cy="66" r="7" fill="${col}"/></svg>`;
}
function prodCards(r, cart){
  const list = [...r.steps.map((k,i) => ({k, why:r.why[i], role:(i+1)+" · "+ROLE[i], main:true})),
                ...r.extras.map(e => ({k:e.k, why:e.why, role:"En plus", main:false}))];
  return `<div class="pgrid">${list.map((it,i) => { const p = P[it.k], col = RANGE_COL[p.range];
    return `<article class="pcard" style="--i:${i}"><div class="pimg" style="background:${p.img ? "#FAF4E8" : col+"14"}">${p.img ? `<img src="${p.img}" alt="${esc(p.name)}">` : bottle(col)}</div>
      <div class="pbody"><span class="prole" style="background:${it.main?"#FF8189":"var(--ink)"}">${it.role}</span>
      <div class="prange" style="color:${RANGE_TXT[p.range]}">Gamme ${esc(p.range)}${p.fruit?` · ${p.fruit==="abricot"?"à l'":"au "}${esc(p.fruit)}`:""}</div><h3>${esc(p.name)}</h3>${p.price?`<div class="pprice">${p.price}</div>`:""}
      <div class="pwhy">${esc(it.why)}</div>${cart?`<button class="padd" data-k="${it.k}">${CART[it.k]?"Dans le panier ✓":"Ajouter au panier"}</button>`:""}</div></article>`; }).join("")}</div><div class="pnote">Photos et prix : catalogue Pulpe de Vie</div>`;
}


/* =========================================================
   Panier (version téléphone) : livraison offerte dès 20 €
   ========================================================= */
const FREE_SHIP = 20;
const CART = {};
const euro = n => n.toFixed(2).replace(".", ",") + " €";
const priceOf = k => parseFloat(String(P[k].price||"0").replace(/[^\d,]/g,"").replace(",", ".")) || 0;
const cartCount = () => Object.values(CART).reduce((a,b)=>a+b,0);
const cartTotal = () => Object.entries(CART).reduce((t,[k,q])=>t+priceOf(k)*q,0);
function addToCart(k, q=1){ CART[k] = (CART[k]||0) + q; if (CART[k] <= 0) delete CART[k]; refreshCart(); }
function shipText(){
  const t = cartTotal(), left = FREE_SHIP - t;
  return left > 0 ? `Plus que <b>${euro(left)}</b> pour la livraison offerte` : `<b>Livraison offerte</b> sur votre commande`;
}
function refreshCart(){
  document.querySelectorAll(".padd").forEach(b => { const on = !!CART[b.dataset.k]; b.classList.toggle("on", on); b.textContent = on ? "Dans le panier ✓" : "Ajouter au panier"; });
  const t = cartTotal(), pct = Math.min(100, t / FREE_SHIP * 100);
  const sb = document.getElementById("shipbar");
  if (sb) sb.innerHTML = `<div class="shiptxt">${cartCount() ? shipText() : `Livraison offerte dès <b>${FREE_SHIP} €</b> d'achat`}</div><div class="shiptrack"><i style="width:${pct}%"></i></div>`;
  let bar = document.getElementById("cartbar");
  if (!bar){ bar = document.createElement("div"); bar.id = "cartbar"; document.body.appendChild(bar); }
  const n = cartCount();
  bar.className = n && mode()==="web" ? "on" : "";
  bar.innerHTML = n ? `<div><b>${n} article${n>1?"s":""} · ${euro(t)}</b><small>${t>=FREE_SHIP?"Livraison offerte":"Plus que "+euro(FREE_SHIP-t)+" pour la livraison offerte"}</small></div><button class="wbtn" id="openCart">Voir mon panier</button>` : "";
  const oc = document.getElementById("openCart"); if (oc) oc.onclick = openCart;
  const drawer = document.getElementById("cartdrawer"); if (drawer && drawer.classList.contains("on")) drawCart();
}
function openCart(){
  let d = document.getElementById("cartdrawer");
  if (!d){ d = document.createElement("div"); d.id = "cartdrawer"; document.body.appendChild(d); }
  d.classList.add("on"); drawCart();
}
function closeCart(){ const d = document.getElementById("cartdrawer"); if (d) d.classList.remove("on"); }
function drawCart(done){
  const d = document.getElementById("cartdrawer"); if (!d) return;
  const t = cartTotal(), items = Object.entries(CART);
  if (done){
    d.innerHTML = `<div class="cpanel"><div class="chead"><h2>Panier <em>validé</em></h2><button class="cx" id="cclose" aria-label="Fermer">×</button></div>
      <p class="muted" style="line-height:1.5">Merci ! Votre rituel (${cartCount()} article${cartCount()>1?"s":""}, ${euro(t)}) est prêt${t>=FREE_SHIP?", avec la livraison offerte":""}.</p>
      <p class="pnote">Prototype de démonstration : aucune commande ni aucun paiement n'est effectué.</p>
      <button class="wbtn" id="cok" style="margin-top:14px">Fermer</button></div>`;
    document.getElementById("cclose").onclick = closeCart; document.getElementById("cok").onclick = closeCart; return;
  }
  d.innerHTML = `<div class="cpanel"><div class="chead"><h2>Mon <em>panier</em></h2><button class="cx" id="cclose" aria-label="Fermer">×</button></div>
    ${items.length ? items.map(([k,q]) => `<div class="citem"><img src="${P[k].img}" alt=""><div class="cinfo"><b>${esc(P[k].name)}</b><span>${P[k].price}</span></div>
      <div class="cqty"><button data-k="${k}" data-d="-1" aria-label="Moins">−</button><span>${q}</span><button data-k="${k}" data-d="1" aria-label="Plus">+</button></div></div>`).join("")
      : `<p class="muted">Votre panier est vide.</p>`}
    <div class="shipbar">${`<div class="shiptxt">${shipText()}</div><div class="shiptrack"><i style="width:${Math.min(100,t/FREE_SHIP*100)}%"></i></div>`}</div>
    <div class="crow"><span>Sous-total</span><span>${euro(t)}</span></div>
    <div class="crow"><span>Livraison</span><span>${t>=FREE_SHIP ? "Offerte" : "Offerte dès "+FREE_SHIP+" €"}</span></div>
    <div class="crow total"><span>Total</span><span>${euro(t)}</span></div>
    <button class="wbtn" id="cvalid" ${items.length?"":"disabled"}>Valider mon panier</button></div>`;
  document.getElementById("cclose").onclick = closeCart;
  d.onclick = e => { if (e.target === d) closeCart(); };
  d.querySelectorAll(".cqty button").forEach(b => b.onclick = () => addToCart(b.dataset.k, +b.dataset.d));
  const v = document.getElementById("cvalid"); if (v) v.onclick = () => drawCart(true);
}
function wireCart(r){
  document.querySelectorAll(".padd").forEach(b => b.onclick = () => { CART[b.dataset.k] ? (delete CART[b.dataset.k], refreshCart()) : addToCart(b.dataset.k); });
  const all = document.getElementById("addAll");
  if (all) all.onclick = () => { [...r.steps, ...r.extras.map(e=>e.k)].forEach(k => { if (!CART[k]) CART[k] = 1; }); refreshCart(); openCart(); };
  refreshCart();
}

/* ---------- Borne : remise à zéro après inactivité ---------- */
let idleT = null, idleCount = null;
const idleBox = document.getElementById("idle");
function armIdle(){
  clearTimeout(idleT); clearInterval(idleCount); idleBox.classList.remove("on");
  clearTimeout(resetTimer);
  if (mode() !== "borne" || !Object.keys(state.answers).length) return;
  if (state.result){ resetTimer = setTimeout(restart, 90000); return; }
  idleT = setTimeout(() => {
    let n = 10; document.getElementById("idleN").textContent = n; idleBox.classList.add("on");
    idleCount = setInterval(() => { n--; document.getElementById("idleN").textContent = n; if (n <= 0){ clearInterval(idleCount); restart(); } }, 1000);
  }, 45000);
}
["pointerdown","keydown"].forEach(ev => document.addEventListener(ev, () => { if (!idleBox.classList.contains("on")) armIdle(); }, {passive:true}));
document.getElementById("idleBtn").onclick = armIdle;

   Données : diagnostics + dernier résultat pour l'écran 43"

let db = null, memory = [];
const dbReady = (async () => { try { db = await window.claude?.use?.("db"); } catch { db = null; } return db; })();
dbReady.then(() => { if (mode()==="ecran" || mode()==="admin") render(); });

async function saveEntry(){
  const r = state.result, c = state.contact;
  const entry = { createdAt:new Date().toISOString(), prenom:c.prenom, email:c.email,
    consentResultats:c.consent, optinNewsletter:c.news, source: mode()==="borne" ? "borne pop-up" : "web",
    reponses:state.answers, fruit:r.fruit, rituel:[...r.steps, ...r.extras.map(e=>e.k)].map(k=>P[k].name) };
  memory.unshift(entry);
  if (!db) return;
  const tryTwice = async fn => { try { await fn(); } catch (e) { if (e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); try{ await fn(); }catch{} } } };
  await tryTwice(() => db.collection("diagnostics").add(entry));
  if (mode() === "borne") tryTwice(() => db.doc("ecran/dernier").set({prenom:c.prenom, fruit:r.fruit, at:entry.createdAt}));
}

/* ---------- Écran vertical 43" (#ecran) ---------- */
let loopT = null, revealT = null, screenUnsub = null, lastSeen = null;
function stopScreenLoop(){ clearInterval(loopT); clearTimeout(revealT); }
function renderScreen(){
  root.innerHTML = `<div class="screen43" id="s43">
    ${LOGO.replace('class="logo"','class="logo big"')}<div class="tag">Votre peau, en 30 secondes</div>
    <div class="frame"><div class="kicker" id="sk">Écran diagnostic</div>
      <h1 id="sh">Quel fruit<br>êtes-vous ?</h1>
      <div class="discs">${ORDER.map(k=>`<span class="disc ph" data-k="${k}" style="${fbg(k)}"></span>`).join("")}</div>
      <div class="fname" id="sn"></div><div class="fdesc" id="sd"></div>
      <div class="cta" id="sc">Touchez une borne pour commencer</div></div></div>`;
  let i = 0;
  const show = k => {
    document.querySelectorAll(".screen43 .disc").forEach(d => d.classList.toggle("on", d.dataset.k === k));
    document.getElementById("sn").textContent = FRUITS[k].name;
    document.getElementById("sd").textContent = FRUITS[k].skin;
  };
  const loop = () => { show(ORDER[i % 4]); i++; };
  loop(); loopT = setInterval(loop, 4000);
  if (db && !screenUnsub){
    screenUnsub = db.doc("ecran/dernier").onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      if (!d || !FRUITS[d.fruit]) return;
      if (lastSeen === null){ lastSeen = d.at; return; }     // ignore l'état au chargement
      if (d.at === lastSeen || mode() !== "ecran") return;
      lastSeen = d.at; reveal(d);
    }, () => {});
  }
  function reveal(d){
    clearInterval(loopT); clearTimeout(revealT);
    const F = FRUITS[d.fruit];
    document.getElementById("s43").classList.add("reveal");
    document.getElementById("sk").textContent = "Résultat";
    document.getElementById("sh").innerHTML = `${d.prenom ? esc(d.prenom)+",<br>" : ""}vous êtes<br><em>${F.name}</em>`;
    show(d.fruit);
    document.getElementById("sn").textContent = "";
    document.getElementById("sd").textContent = F.skin;
    document.getElementById("sc").textContent = `Rendez-vous à l'arche ${F.name}`;
    revealT = setTimeout(() => { if (mode()==="ecran") renderScreen(); }, 20000);
  }
}

      <h2>E-mails <em>collectés</em></h2>
      <p class="muted" style="margin:6px 0 0">${db ? (adminRows===null && !adminErr ? "Chargement…" : "Mis à jour en direct.") : "Mode démo : seuls les diagnostics faits sur cet appareil apparaissent."}</p>
      ${adminErr ? `<div class="note-box" style="margin-top:12px">${esc(adminErr)}</div>` : ""}
      <div class="stats">
        <div class="stat"><b>${rows.length}</b><span>diagnostics</span></div>
        <div class="stat"><b>${rows.length ? Math.round(optin/rows.length*100) : 0} %</b><span>opt-in newsletter</span></div>
        ${ORDER.map(k=>`<div class="stat"><b style="color:${FRUITS[k].color}">${byFruit[k]}</b><span>${FRUITS[k].name}</span></div>`).join("")}
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Date</th><th>Prénom</th><th>E-mail</th><th>Fruit</th><th>Source</th><th>News</th></tr></thead>
        <tbody>${rows.length ? rows.map(r => `<tr><td>${esc(new Date(r.createdAt).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}))}</td><td>${esc(r.prenom)}</td><td>${esc(r.email)}</td><td>${esc(FRUITS[r.fruit]?.name)}</td><td>${esc(r.source)}</td><td>${r.optinNewsletter?"Oui":"—"}</td></tr>`).join("") : `<tr><td colspan="6" class="muted" style="text-align:center;padding:22px">Aucun diagnostic pour l'instant.</td></tr>`}</tbody>
      </table></div>
      <div class="nav"><span></span><button class="btn" id="csv" ${rows.length?"":"disabled"}>Copier en CSV</button></div>
    </section></div>`;
  document.getElementById("csv").onclick = async e => {
    const head = ["date","prenom","email","optin_newsletter","fruit","source","type_peau","priorite","preoccupation","stress_oxydatif","texture","rituel"];
    const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
    const lines = rows.map(r => [r.createdAt,r.prenom,r.email,r.optinNewsletter?"oui":"non",FRUITS[r.fruit]?.name,r.source,r.reponses?.type,r.reponses?.prio,r.reponses?.concern,r.reponses?.stress,r.reponses?.texture,(r.rituel||[]).join(" > ")].map(q).join(";"));
    try { await navigator.clipboard.writeText([head.join(";"), ...lines].join("\n")); e.target.textContent = "Copié"; } catch { e.target.textContent = "Copie refusée"; }
  };
}

window.addEventListener("hashchange", () => { root.innerHTML = ""; if (mode()==="borne" || mode()==="web") state = blank(); render(); });
render();
</script>
</body>
</html>
